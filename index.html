<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇幻大富翁 · UI／UX 優化方向</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Cinzel:wght@600;700&display=swap');
  html,body{margin:0;height:100%;}
  .ab-frame{width:100%;height:100%;border:0;display:block;pointer-events:none;background:#0a0719;border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const {useState} = React;

function Screen({src}){
  return <iframe className="ab-frame" src={src} scrolling="no" loading="eager"></iframe>;
}

function App(){
  return (
    <DesignCanvas>
      <DCSection id="desktop" title="桌面 / 平板 · 橫式 16:10" subtitle="經典環形棋盤 · 建築美術圖大幅放大 · 華麗厚重的金箔寶石視覺">
        <DCArtboard id="select" label="① 角色選擇 · Choose Your Champion" width={1280} height={800}>
          <Screen src="screens/character-select.html"/>
        </DCArtboard>
        <DCArtboard id="board" label="② 主棋盤 · Game Board（核心畫面）" width={1280} height={800}>
          <Screen src="screens/board.html"/>
        </DCArtboard>
        <DCArtboard id="victory" label="③ 勝利結算 · Victor of Ilumiya" width={1280} height={800}>
          <Screen src="screens/victory.html"/>
        </DCArtboard>
      </DCSection>

      <DCSection id="moments" title="關鍵時刻 & 手機版 · 直式" subtitle="抽卡與購地的彈窗質感 · 以及響應式手機佈局">
        <DCArtboard id="card" label="④ 命運神諭 · 抽卡時刻" width={600} height={800}>
          <Screen src="screens/card-draw.html"/>
        </DCArtboard>
        <DCArtboard id="deed" label="⑤ 領地契約 · 購地彈窗" width={600} height={800}>
          <Screen src="screens/property.html"/>
        </DCArtboard>
        <DCArtboard id="mobile" label="⑥ 手機版主畫面 · 響應式" width={420} height={860}>
          <Screen src="screens/mobile.html"/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
